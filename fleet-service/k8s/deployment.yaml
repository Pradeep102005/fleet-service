apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetpulse-backend
  labels:
    app: fleetpulse
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fleetpulse
  template:
    metadata:
      labels:
        app: fleetpulse
    spec:
      containers:
      - name: fleetpulse
        image: your-docker-repo/fleetpulse:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/fleetpulse"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: password
        - name: SPRING_REDIS_HOST
          value: "redis-service"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-service:9092"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
